name: mama-terraform

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
      - 'feature/**'


jobs:
  terraform:
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Repository
        run: |
          Write-Host "Repository Root:"
          Get-Location

          Write-Host "All Files:"
          Get-ChildItem -Force

          Write-Host "Terraform Files:"
          Get-ChildItem -Filter *.tf -Recurse

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::484614878994:role/GitHubTerraformRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: Terraform Version
        run: terraform version

      - name: Verify Terraform Working Directory
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "main.tf exists:"
          Test-Path .\main.tf

          Write-Host "Terraform files:"
          Get-ChildItem *.tf

      - name: Terraform Init
        run: terraform -chdir=parent init

      - name: Terraform Validate
        run: terraform -chdir=parent validate

      # Feature branch: Plan only
      - name: Terraform Plan
        if: startsWith(github.ref, 'refs/heads/feature/')
        run: terraform -chdir=parent plan

      # Main branch: Apply
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=parent apply -auto-approve
